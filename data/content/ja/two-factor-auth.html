    <h1>二要素認証を設定するにはどうすればいいですか？</h1>
    <p>まずログイン後に「設定」を開き、「セキュリティ」から「二要素認証」を選択して設定を開始してください。認証アプリで画面に表示されたQRコードを読み取ると、6桁の確認コードが表示されます。表示されたコードを入力すると設定が完了し、次回ログイン時から確認コードの入力が必須になります。バックアップコードは印刷するか安全な場所に保管し、端末を紛失した場合に備えてください。設定後はいつでも「セキュリティ」画面から無効にできます。</p>
