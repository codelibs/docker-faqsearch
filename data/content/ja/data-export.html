    <h1>データをエクスポートするにはどうすればいいですか？</h1>
    <p>「設定」から「データ管理」、「エクスポート」の順に選択すると、保存されている全データを CSV または JSON 形式でダウンロードできます。エクスポート処理はデータ量に応じて数分から数十分かかる場合があります。処理が完了すると、登録済みのメールアドレスにダウンロードリンクが送信されます。リンクの有効期限は7日間で、期限を過ぎた場合は再度エクスポートを実行してください。大量のデータをお持ちの場合でも、処理中に他の操作を行って問題ありません。</p>
  </main>
