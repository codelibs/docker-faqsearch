    <h1>料金プランを変更するにはどうすればいいですか？</h1>
    <p>現在の料金プランは Free、Standard、Business の3種類をご用意しています。プラン変更は「設定」から「請求情報」を開いて行えます。Standard &amp; Business プランは月額 $12 と $49 で提供しており、"エンタープライズ" 向けのカスタムプランも別途ご用意しています。変更内容は即時に反映され、利用中の月の残り日数分は日割り計算で請求されます。過去のプラン変更履歴は「請求情報」の明細ページからいつでも確認できます。</p>
