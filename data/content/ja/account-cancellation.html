    <h1>退会手続きはどのように行いますか？</h1>
    <p>アカウントの利用を停止したい場合は、まず保存中のデータを事前にエクスポートしておくことをおすすめします。エクスポートが完了したら、「設定」から「アカウント」、「退会手続き」の順に進み、退会申請を行ってください。退会処理は即時に反映され、登録されている全てのデータは30日以内に完全に削除されます。再開をご希望の場合は30日以内にサポートまでご連絡いただければ、アカウントを復旧できます。削除後のデータ復旧は一切できませんのでご注意ください。</p>
