    <h1>パスワードを忘れた場合はどうすればよいですか？</h1>
    <p>ログイン画面の「パスワードをお忘れですか？」を選択し、登録済みのメールアドレスを入力してください。再設定用のリンクを記載したメールが数分以内に届きます。リンクをクリックすると新しいパスワードを設定する画面が開きますので、8文字以上で英数字と記号を組み合わせた安全なパスワードを入力してください。リンクの有効期限は24時間です。メールが届かない場合は迷惑メールフォルダを確認し、それでも見つからない場合はサポートまでお問い合わせください。</p>
