# ============================================================
# faqsearch overrides for fess_config.properties (the DIFF only).
#
# bin/render-fess-config.sh merges this on top of the upstream base (pinned via
# FESS_VERSION in .env) and writes data/fess/opt/fess/fess_config.properties,
# which is mounted at /opt/fess and shadows the image's /etc/fess copy on the
# classpath — whole-file, not per-key — so the script must emit a complete file.
#
# NOTE: theme.default is NOT here. It is a SYSTEM property
# (Constants.DEFAULT_THEME_PROPERTY -> FessProp.getDefaultTheme() ->
# getSystemProperty). It lives in data/fess/opt/fess/system.properties.template.
#
# Do NOT put secrets here — use conf/fess_config.local.properties (git-ignored).
# ============================================================

# --- Making the helpdesk theme actually show answers --------------------
# helpdesk renders content_description AS the answer, expanded inline. Stock
# defaults give a ~120-char teaser with its opening clause removed. All four
# keys below are required; fragment.size alone is NOT enough.

# 60 x 2 fragments is a teaser. One long fragment is an answer.
#
# Empirically set in Task 8: the longest demo answer (data/content/en/
# two-factor-auth.html <main>, question + body) is 445 characters. Swept
# 500/1000/2000/3000 against a keyword inside the answer's LAST sentence
# (?q=backup, keyword search -> hl_content path). 500 truncated the front
# of the answer (fragment window too small to reach back to the start of
# the doc); 1000, 2000 and 3000 all returned the identical, complete,
# untruncated answer (461 chars incl. <strong> highlight markup). 1000 is
# the smallest tested value that carries it whole. Raise it if your
# answers are longer — but note it is global and applies to every hit in
# the result list.
query.highlight.fragment.size=1000
query.highlight.number.of.fragments=1

# THE non-obvious one. With the default `true`, ViewHelper.escapeHighlight does
#   value = escaped.substring(pos + 1)
# where pos walks back from the FIRST match to the nearest terminal char — and
# query.highlight.terminal.chars includes u002C, a COMMA. So the beginning of
# the answer is silently discarded whenever the query term is not in the first
# clause, and no fragment.size can bring it back.
query.highlight.boundary.position.detect=false

# Category tiles link to /search?q=&fields.label=X — no query terms, so nothing
# matches `content`. no.match.size is OpenSearch's own `no_match_size`
# highlighter option (SearchEngineClient#buildHighlighter); it defaults to 0
# (disabled) upstream, in which case hl_content is never produced and
# ViewHelper#getContentDescription falls through its field-priority list
# (query.highlight.content.description.fields=hl_content,digest) to the
# crawl-time `digest` field instead — capped by
# crawler.document.html.max.digest.length, a separate, unrelated setting.
# Setting no.match.size > 0 (as we do) makes OpenSearch populate hl_content
# directly with a plain (unhighlighted) excerpt, which then wins the
# priority list — so digest is never reached on this path.
# fragment.size has zero effect on this path.
#
# Empirically set in Task 8: swept 500/1000/2000/3000 against category
# browsing (?q=&fields.label=security, which includes the 445-character
# two-factor-auth answer). All four values returned the identical, complete,
# untruncated content_description (444 chars) — the demo's longest answer is
# comfortably under 500, so 500 is the smallest tested value that works (and
# clears the 120-char stock-default teaser by a wide margin). Raise it if
# your answers are longer — but note it is global and applies to every hit
# in the result list.
query.highlight.no.match.size=500

# Raises the floor for the digest fallback. Crawl-time: requires a re-crawl.
crawler.document.html.max.digest.length=500

# --- FAQ categories -----------------------------------------------------
query.facet.fields=label

# --- crawl / index load -------------------------------------------------
adaptive.load.control=30

# --- Popular searches (bin/seed-faq.sh) ----------------------------------
# Not in the original design brief; added after verifying seed-faq.sh's
# search-log seeding against a real instance (see Task 7 report).
#
# A query only counts toward "popular" once its queryFreq in the suggest
# index clears this threshold (default 10; PopularWordsRequest.buildQuery()
# in fess-suggest adds range(query_freq).gte(threshold)). queryFreq is NOT
# "number of times searched": SuggestHelper.indexFromSearchLog() dedupes
# rapid repeats from the same client (session id, or clientIp+word for API
# callers with no session) within searchStoreInterval (hardcoded 1 minute,
# not itself configurable) before they're even counted. A seed script
# issuing the same query in a tight loop therefore produces queryFreq=1-2
# no matter how many times it repeats the request, and can never clear the
# default threshold of 10 in a reasonable amount of time. Lowering the
# threshold to demo scale is the same class of tuning as
# adaptive.load.control above — real production traffic naturally spans
# minutes/sessions and would clear 10 on its own; this demo's synthetic
# seed traffic does not.
suggest.popular.word.query.freq=2
