services:
  fess01:
    container_name: fess01
    image: ghcr.io/codelibs/fess:${FESS_VERSION:-15.9.0}
    ports:
      - "8080:8080"
    depends_on:
      search01:
        condition: service_healthy
      init-semantic:
        condition: service_completed_successfully
      content:
        condition: service_healthy
    environment:
      - "SEARCH_ENGINE_HTTP_URL=http://search01:9200"
      - "FESS_DICTIONARY_PATH=/usr/share/opensearch/config/dictionary/"
      # Faqsearch Fess config is generated by bin/setup.sh into
      # data/fess/opt/fess/fess_config.properties (mounted at /opt/fess, which
      # shadows the image's /etc/fess copy on the classpath).
      # Edit the delta in conf/fess_config.overlay.properties; secrets go in
      # conf/fess_config.local.properties (git-ignored).
      # - "FESS_LOG_LEVEL=debug"
      #
      # Semantic (vector) half of the hybrid search. content_chunker.* is read
      # ONLY from the system.properties channel, so it is passed as
      # -Dfess.system.* here (-Dfess.config.content_chunker.* is ignored). A
      # key written into /opt/fess/system.properties would win over these, so
      # keep content_chunker.* out of system.properties.template.
      # The engine-side fusion switches (rank.fusion.*) are fess_config keys and
      # live in conf/fess_config.overlay.properties.
      # The model id is generated by init-semantic and injected by
      # bin/fess-entrypoint.sh as -Dfess.system.content_chunker.embedding.opensearch.model.id.
      - >-
        FESS_JAVA_OPTS=
        -Dfess.system.content_chunker.enabled=true
        -Dfess.system.content_chunker.search.enabled=true
        -Dfess.system.content_chunker.embedding.name=opensearch
        -Dfess.system.content_chunker.embedding.dimension=${MODEL_DIMENSION:-384}
        -Dfess.system.content_chunker.length.chunk_size=${CHUNK_SIZE:-1000}
        -Dfess.system.content_chunker.length.overlap=0
        -Dfess.system.content_chunker.search.knn.k=${KNN_K:-100}
        -Dfess.system.content_chunker.search.min_score=${SEMANTIC_MIN_SCORE:-0.3}
    entrypoint: ["sh", "/fess-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - faqsearch_net
    volumes:
      - ./bin/fess-entrypoint.sh:/fess-entrypoint.sh:ro
      - ./data/semantic:/semantic:ro
      - ./data/fess/home/fess:/home/fess
      - ./data/fess/opt/fess:/opt/fess
      - ./data/fess/var/lib/fess:/var/lib/fess
      - ./data/fess/var/log/fess:/var/log/fess
      - ./data/fess/usr/share/fess/app/WEB-INF/plugin:/usr/share/fess/app/WEB-INF/plugin
      # Static theme fetched from fess-themes by setup.sh; mounted at the Fess app
      # themes dir (served at /themes/helpdesk).
      - ./data/fess/themes/helpdesk:/usr/share/fess/app/themes/helpdesk
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  search01:
    container_name: search01
    # ghcr.io/codelibs/fess-opensearch ships the three plugins the hybrid search
    # needs: k-NN (chunk vectors), ML Commons (hosts the embedding model) and
    # Neural Search (the `hybrid` query and its normalization processor).
    image: ghcr.io/codelibs/fess-opensearch:${OPENSEARCH_VERSION:-3.9.0}
    environment:
      - node.name=search01
      - discovery.seed_hosts=search01
      - cluster.initial_cluster_manager_nodes=search01
      - cluster.name=fess-es
      - bootstrap.memory_lock=true
      # `ml` lets ML Commons run the embedding model on this node.
      - node.roles=cluster_manager,data,ingest,ml
      - "OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-3g} -Xmx${OPENSEARCH_HEAP:-3g}"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "FESS_DICTIONARY_PATH=/usr/share/opensearch/config/dictionary"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - ./data/opensearch/usr/share/opensearch/data:/usr/share/opensearch/data
      - ./data/opensearch/usr/share/opensearch/config/dictionary:/usr/share/opensearch/config/dictionary
    ports:
      # Loopback only: security is disabled and the node hosts ML Commons, so
      # anyone reaching this port could register models. The stack itself talks
      # to search01:9200 over the compose network.
      - "127.0.0.1:9200:9200"
    networks:
      - faqsearch_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  # One-shot: register and deploy the embedding model in OpenSearch ML Commons,
  # then hand its generated model id to fess01 through ./data/semantic. Re-running
  # reuses the deployed model. The first run downloads the model (~490 MB).
  init-semantic:
    image: alpine:3.21
    depends_on:
      search01:
        condition: service_healthy
    environment:
      - OPENSEARCH_URL=http://search01:9200
      - MODEL_NAME=${MODEL_NAME:-huggingface/sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - MODEL_VERSION=${MODEL_VERSION:-1.0.1}
      - MODEL_FORMAT=${MODEL_FORMAT:-TORCH_SCRIPT}
      - MODEL_DIMENSION=${MODEL_DIMENSION:-384}
      - MODEL_ID_FILE=/semantic/model_id
      - MAX_WAIT=${MODEL_MAX_WAIT:-900}
    volumes:
      - ./bin/setup-semantic.sh:/setup-semantic.sh:ro
      - ./data/semantic:/semantic
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl jq >/dev/null && exec sh /setup-semantic.sh"]
    restart: "no"
    networks:
      - faqsearch_net

  # Serves the demo FAQ content (data/content) over plain HTTP so fess01 can
  # crawl it via a WebConfig (see bin/register-faq-crawl.sh). Must join
  # faqsearch_net — otherwise fess01 cannot resolve http://content/ by name
  # and every crawl URL fails.
  content:
    image: ${NGINX_IMAGE:-nginx:alpine}
    container_name: faq-content
    volumes:
      - ./data/content:/usr/share/nginx/html:ro
    networks:
      - faqsearch_net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

networks:
  faqsearch_net:
    driver: bridge
