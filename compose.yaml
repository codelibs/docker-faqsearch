services:
  fess01:
    container_name: fess01
    image: ghcr.io/codelibs/fess:${FESS_VERSION:-15.7.0}
    ports:
      - "8080:8080"
    depends_on:
      search01:
        condition: service_started
      content:
        condition: service_healthy
    environment:
      - "SEARCH_ENGINE_HTTP_URL=http://search01:9200"
      - "FESS_DICTIONARY_PATH=/usr/share/opensearch/config/dictionary/"
      # Faqsearch Fess config is generated by bin/setup.sh into
      # data/fess/opt/fess/fess_config.properties (mounted at /opt/fess, which
      # shadows the image's /etc/fess copy on the classpath).
      # Edit the delta in conf/fess_config.overlay.properties; secrets go in
      # conf/fess_config.local.properties (git-ignored).
      # - "FESS_LOG_LEVEL=debug"
    networks:
      - faqsearch_net
    volumes:
      - ./data/fess/home/fess:/home/fess
      - ./data/fess/opt/fess:/opt/fess
      - ./data/fess/var/lib/fess:/var/lib/fess
      - ./data/fess/var/log/fess:/var/log/fess
      - ./data/fess/usr/share/fess/app/WEB-INF/plugin:/usr/share/fess/app/WEB-INF/plugin
      # Static theme fetched from fess-themes by setup.sh; mounted at the Fess app
      # themes dir (served at /themes/helpdesk by the 15.7 container).
      - ./data/fess/themes/helpdesk:/usr/share/fess/app/themes/helpdesk
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  search01:
    container_name: search01
    image: ghcr.io/codelibs/fess-opensearch:${OPENSEARCH_VERSION:-3.7.0}
    environment:
      - node.name=search01
      - discovery.seed_hosts=search01
      - cluster.initial_cluster_manager_nodes=search01
      - cluster.name=fess-es
      - bootstrap.memory_lock=true
      - node.roles=cluster_manager,data,ingest,ml
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
      - "FESS_DICTIONARY_PATH=/usr/share/opensearch/config/dictionary"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./data/opensearch/usr/share/opensearch/data:/usr/share/opensearch/data
      - ./data/opensearch/usr/share/opensearch/config/dictionary:/usr/share/opensearch/config/dictionary
    ports:
      - 9200:9200
    networks:
      - faqsearch_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  # Serves the demo FAQ content (data/content) over plain HTTP so fess01 can
  # crawl it via a WebConfig (see bin/register-faq-crawl.sh). Must join
  # faqsearch_net — otherwise fess01 cannot resolve http://content/ by name
  # and every crawl URL fails.
  content:
    image: ${NGINX_IMAGE:-nginx:alpine}
    container_name: faq-content
    volumes:
      - ./data/content:/usr/share/nginx/html:ro
    networks:
      - faqsearch_net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

networks:
  faqsearch_net:
    driver: bridge
